<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juned AI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 800px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #292929;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .msg {
      max-width: 85%;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 14px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .user {
      margin-left: auto;
      background: #303030;
    }

    .ai {
      background: #181818;
      border: 1px solid #292929;
    }

    .bottom {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #292929;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #181818;
      color: white;
      outline: none;
    }

    button {
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="app">
  <header>Juned AI</header>

  <div id="chat"></div>

  <div class="bottom">
    <input id="input" placeholder="Tulis pesan..." autocomplete="off">
    <button onclick="sendMessage()">Kirim</button>
  </div>
</div>

<script>
const messages = [];

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;

  const chat = document.getElementById("chat");
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  return div;
}

async function sendMessage() {
  const input = document.getElementById("input");
  const text = input.value.trim();

  if (!text) return;

  input.value = "";
  addMessage(text, "user");

  messages.push({
    role: "user",
    content: text
  });

  const loading = addMessage("Mengetik...", "ai");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: messages
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Request gagal");
    }

    loading.remove();

    addMessage(data.answer, "ai");

    messages.push({
      role: "assistant",
      content: data.answer
    });

  } catch (error) {
    loading.textContent = "Error: " + error.message;
  }
}

document.getElementById("input").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    sendMessage();
  }
});
</script>

</body>
</html>
